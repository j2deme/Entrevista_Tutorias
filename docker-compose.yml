services:
  app:
    build: .
    container_name: entrevistas_api
    # Si el servidor reinicia, el contenedor vuelve a levantar solo
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    ports:
      - "8095:8000"
    # Docker asocia automáticamente el archivo .env local
    env_file:
      - .env
